<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Should I Coat?</title>
    <style>
      :root {
        --bg: #0b0d12;
        --fg: #f6f7fb;
        --muted: #8a93a6;
        --card: #141823;
        --puff: #3b5fe6;
        --normal: #1fb88e;
        --none: #f5a623;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 20px 24px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
      }
      header .brand {
        font-weight: 600;
      }
      header #loc {
        text-align: right;
      }
      #verdict {
        font-size: clamp(56px, 18vw, 320px);
        font-weight: 800;
        line-height: 0.92;
        letter-spacing: -0.04em;
        transition: color 200ms ease;
      }
      #verdict.puff {
        color: var(--puff);
      }
      #verdict.normal {
        color: var(--normal);
      }
      #verdict.none {
        color: var(--none);
      }
      #verdict.loading::after {
        content: "";
        display: inline-block;
        animation: loading-dots 1.2s steps(4, end) infinite;
      }
      @keyframes loading-dots {
        0% {
          content: "";
        }
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75% {
          content: "...";
        }
        100% {
          content: "";
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">Should I Coat?</div>
      <div id="loc">—</div>
    </header>
    <main>
      <div class="verdict-wrap">
        <div id="eyebrow">Today you should…</div>
        <div id="verdict" class="loading">Checking the sky</div>
        <div id="sub"></div>
        <div id="note"></div>
      </div>
    </main>
    <script>
      function getLocation() {
        const MELBOURNE = { lat: -37.8136, lon: 144.9631, fallback: true };
        return new Promise((resolve) => {
          if (!navigator.geolocation) {
            resolve(MELBOURNE);
            return;
          }
          let settled = false;
          const done = (value) => {
            if (settled) return;
            settled = true;
            resolve(value);
          };
          const timer = setTimeout(() => done(MELBOURNE), 8000);
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              clearTimeout(timer);
              done({
                lat: pos.coords.latitude,
                lon: pos.coords.longitude,
                fallback: false,
              });
            },
            () => {
              clearTimeout(timer);
              done(MELBOURNE);
            },
            { timeout: 8000 }
          );
        });
      }
      async function getForecast(lat, lon) {
        const url =
          "https://api.open-meteo.com/v1/forecast" +
          "?latitude=" +
          encodeURIComponent(lat) +
          "&longitude=" +
          encodeURIComponent(lon) +
          "&hourly=temperature_2m,apparent_temperature" +
          "&timezone=auto" +
          "&forecast_days=1";
        const res = await fetch(url);
        if (!res.ok) {
          throw new Error("Forecast request failed: " + res.status);
        }
        return await res.json();
      }
      async function reverseGeocode(lat, lon) {
        const url =
          "https://geocoding-api.open-meteo.com/v1/reverse" +
          "?latitude=" +
          encodeURIComponent(lat) +
          "&longitude=" +
          encodeURIComponent(lon) +
          "&count=1&language=en&format=json";
        try {
          const res = await fetch(url);
          if (!res.ok) return null;
          const data = await res.json();
          const r = data && data.results && data.results[0];
          if (!r || !r.name) return null;
          const cc = r.country_code ? ", " + r.country_code : "";
          return r.name + cc;
        } catch (e) {
          return null;
        }
      }
    </script>
  </body>
</html>
