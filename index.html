<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Should I Coat?</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
      :root {
        --bg: #0b0d12;
        --fg: #f6f7fb;
        --muted: #8a93a6;
        --card: #141823;
        --puff: #3b5fe6;
        --normal: #1fb88e;
        --none: #f5a623;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 20px 24px;
        font-size: clamp(13px, 1.2vw, 15px);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
      }
      header .brand {
        font-weight: 600;
      }
      header #loc {
        text-align: right;
      }
      main {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .verdict-wrap {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 24px 24px 8px;
      }
      .mode-toggle {
        display: inline-flex;
        align-self: flex-start;
        gap: 2px;
        padding: 4px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        margin-bottom: 4px;
      }
      .mode-option {
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 8px 16px;
        font: inherit;
        font-size: clamp(13px, 1.3vw, 15px);
        color: var(--muted);
        border-radius: 999px;
        transition: background 180ms ease, color 180ms ease;
        letter-spacing: 0.02em;
      }
      .mode-option:hover {
        color: var(--fg);
      }
      .mode-option.is-active {
        background: rgba(255, 255, 255, 0.1);
        color: var(--fg);
      }
      .mode-option:focus-visible {
        outline: 2px solid var(--puff);
        outline-offset: 2px;
      }
      #eyebrow {
        font-size: clamp(18px, 2vw, 24px);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
        font-weight: 500;
      }
      #verdict {
        font-size: clamp(56px, 14vw, 240px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        transition: color 200ms ease;
      }
      #sub {
        font-size: clamp(20px, 2.2vw, 28px);
        color: var(--fg);
        opacity: 0.85;
        font-weight: 400;
      }
      #note {
        font-size: clamp(15px, 1.6vw, 18px);
        color: var(--muted);
      }
      #verdict.puff {
        color: var(--puff);
      }
      #verdict.normal {
        color: var(--normal);
      }
      #verdict.none {
        color: var(--none);
      }
      #verdict.loading::after {
        content: "";
        display: inline-block;
        animation: loading-dots 1.2s steps(4, end) infinite;
      }
      .chart-card {
        background: var(--card);
        border-radius: 16px;
        padding: 20px;
        margin: 12px 24px 24px;
      }
      .chart-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        font-size: clamp(13px, 1.2vw, 15px);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .chart-head .chart-range {
        text-align: right;
      }
      .chart-canvas-wrap {
        position: relative;
        width: 100%;
        height: 180px;
      }
      footer.credit {
        padding: 20px 24px 28px;
        font-size: clamp(12px, 1.1vw, 14px);
        color: var(--muted);
        opacity: 0.7;
        text-align: center;
        letter-spacing: 0.04em;
      }
      footer.credit .dot {
        margin: 0 0.5ch;
        opacity: 0.5;
      }
      #chart {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
      @media (max-width: 640px) {
        .chart-canvas-wrap {
          height: 140px;
        }
      }
      @keyframes loading-dots {
        0% {
          content: "";
        }
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75% {
          content: "...";
        }
        100% {
          content: "";
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">Should I Coat?</div>
      <div id="loc">—</div>
    </header>
    <main>
      <div class="verdict-wrap">
        <div class="mode-toggle" role="tablist" aria-label="Where are you today?">
          <button
            type="button"
            class="mode-option is-active"
            data-mode="outside"
            role="tab"
            aria-selected="true"
          >out and about</button>
          <button
            type="button"
            class="mode-option"
            data-mode="home"
            role="tab"
            aria-selected="false"
          >at home</button>
        </div>
        <div id="eyebrow">Today you should…</div>
        <div id="verdict" class="loading">Checking the sky</div>
        <div id="sub"></div>
        <div id="note"></div>
      </div>
      <section class="chart-card">
        <div class="chart-head">
          <div class="chart-label">Hourly temperature — today</div>
          <div class="chart-range" id="chart-range"></div>
        </div>
        <div class="chart-canvas-wrap">
          <canvas id="chart"></canvas>
        </div>
      </section>
    </main>
    <footer class="credit">
      Built by Maria Vinith Darwin<span class="dot">·</span>a curious "nobody"
    </footer>
    <script>
      function getLocation() {
        const MELBOURNE = { lat: -37.8136, lon: 144.9631, fallback: true };
        return new Promise((resolve) => {
          if (!navigator.geolocation) {
            resolve(MELBOURNE);
            return;
          }
          let settled = false;
          const done = (value) => {
            if (settled) return;
            settled = true;
            resolve(value);
          };
          const timer = setTimeout(() => done(MELBOURNE), 8000);
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              clearTimeout(timer);
              done({
                lat: pos.coords.latitude,
                lon: pos.coords.longitude,
                fallback: false,
              });
            },
            () => {
              clearTimeout(timer);
              done(MELBOURNE);
            },
            { timeout: 8000 }
          );
        });
      }
      async function getForecast(lat, lon) {
        const url =
          "https://api.open-meteo.com/v1/forecast" +
          "?latitude=" +
          encodeURIComponent(lat) +
          "&longitude=" +
          encodeURIComponent(lon) +
          "&hourly=temperature_2m,apparent_temperature" +
          "&timezone=auto" +
          "&forecast_days=1";
        const res = await fetch(url);
        if (!res.ok) {
          throw new Error("Forecast request failed: " + res.status);
        }
        return await res.json();
      }
      async function reverseGeocode(lat, lon) {
        // Try BigDataCloud first — it returns suburb/locality (e.g. "St Kilda")
        // alongside the city, which Open-Meteo's geocoder does not.
        try {
          const url =
            "https://api.bigdatacloud.net/data/reverse-geocode-client" +
            "?latitude=" +
            encodeURIComponent(lat) +
            "&longitude=" +
            encodeURIComponent(lon) +
            "&localityLanguage=en";
          const res = await fetch(url);
          if (res.ok) {
            const d = await res.json();
            // Prefer suburb-level: `locality` (e.g. "St Kilda") over `city`.
            const suburb = d.locality || d.localityInfo?.administrative?.find(
              (a) => a.order >= 6
            )?.name;
            const city = d.city || d.principalSubdivision;
            if (suburb && city && suburb !== city) {
              return suburb + ", " + city;
            }
            if (city) return city;
            if (suburb) return suburb;
          }
        } catch (e) {
          // fall through to Open-Meteo
        }
        // Fallback: Open-Meteo geocoder (city-level only)
        try {
          const url =
            "https://geocoding-api.open-meteo.com/v1/reverse" +
            "?latitude=" +
            encodeURIComponent(lat) +
            "&longitude=" +
            encodeURIComponent(lon) +
            "&count=1&language=en&format=json";
          const res = await fetch(url);
          if (!res.ok) return null;
          const data = await res.json();
          const r = data && data.results && data.results[0];
          if (!r || !r.name) return null;
          const cc = r.country_code ? ", " + r.country_code : "";
          return r.name + cc;
        } catch (e) {
          return null;
        }
      }
      // Outside mode: majority-vote across 8am–8pm apparent temps.
      // Sentence form: "Today you should… <label>"
      function decideOutside(apparentHourly, hourlyTimes) {
        const counts = { puff: 0, normal: 0, none: 0 };
        for (let i = 0; i < hourlyTimes.length; i++) {
          const hour = new Date(hourlyTimes[i]).getHours();
          if (hour < 8 || hour > 20) continue;
          const t = apparentHourly[i];
          if (t == null) continue;
          if (t < 10) counts.puff++;
          else if (t <= 18) counts.normal++;
          else counts.none++;
        }
        const order = ["puff", "normal", "none"];
        const labels = {
          puff: "Bundle up.",
          normal: "Pack a jacket.",
          none: "Live a little, no jacket.",
        };
        let winner = order[0];
        for (const key of order) {
          if (counts[key] > counts[winner]) winner = key;
        }
        return { key: winner, label: labels[winner] };
      }
      // Home mode: current hour's apparent temp only. Two states.
      // Sentence form: "Today you should… <label>"
      function decideHome(apparentHourly, hourlyTimes) {
        const nowHour = new Date().getHours();
        let current = null;
        for (let i = 0; i < hourlyTimes.length; i++) {
          if (new Date(hourlyTimes[i]).getHours() === nowHour) {
            current = apparentHourly[i];
            break;
          }
        }
        // If we somehow can't find the current hour, fall back to the first
        // non-null reading rather than crash. Verdict stays well-formed.
        if (current == null) {
          current = apparentHourly.find((t) => t != null);
        }
        if (current != null && current < 17) {
          return { key: "puff", label: "Throw on a hoodie and trackies." };
        }
        return { key: "none", label: "Be good in your pyjamas." };
      }
      function drawChart(times, actualTemps, apparentTemps) {
        const ctx = document.getElementById("chart");
        if (!ctx || typeof Chart === "undefined") return;
        const labels = times.map((t) => {
          const h = new Date(t).getHours();
          return h < 10 ? "0" + h : "" + h;
        });
        // Compute these once — running findIndex inside the plugin on every
        // redraw caused noticeable scroll jank.
        const startIdx = labels.findIndex((l) => parseInt(l, 10) === 8);
        const endIdx = labels.findIndex((l) => parseInt(l, 10) === 20);
        const nowHour = new Date().getHours();
        const nowIdx = labels.findIndex((l) => parseInt(l, 10) === nowHour);
        const decisionWindowPlugin = {
          id: "decisionWindow",
          beforeDatasetsDraw(chart) {
            const { ctx, chartArea, scales } = chart;
            if (!chartArea || !scales.x) return;
            const xScale = scales.x;
            if (startIdx === -1 || endIdx === -1) return;
            const xStart = xScale.getPixelForValue(startIdx);
            const xEnd = xScale.getPixelForValue(endIdx);
            ctx.save();
            ctx.fillStyle = "rgba(255,255,255,0.06)";
            ctx.fillRect(
              xStart,
              chartArea.top,
              xEnd - xStart,
              chartArea.bottom - chartArea.top
            );
            if (nowIdx !== -1) {
              const xNow = xScale.getPixelForValue(nowIdx);
              ctx.strokeStyle = "rgba(255,255,255,0.3)";
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(xNow, chartArea.top);
              ctx.lineTo(xNow, chartArea.bottom);
              ctx.stroke();
            }
            ctx.restore();
          },
        };
        return new Chart(ctx, {
          type: "line",
          plugins: [decisionWindowPlugin],
          data: {
            labels: labels,
            datasets: [
              {
                label: "Actual",
                data: actualTemps,
                borderColor: "rgba(246,247,251,0.8)",
                backgroundColor: "rgba(246,247,251,0.8)",
                borderWidth: 2,
                tension: 0.35,
                pointRadius: 0,
              },
              {
                label: "Feels like",
                data: apparentTemps,
                borderColor: "#f5a623",
                backgroundColor: "#f5a623",
                borderDash: [6, 4],
                borderWidth: 2,
                tension: 0.35,
                pointRadius: 0,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: {
                ticks: {
                  color: "#8a93a6",
                  callback: function (value, index) {
                    const label = this.getLabelForValue(value);
                    const h = parseInt(label, 10);
                    return h % 3 === 0 ? label : "";
                  },
                  maxRotation: 0,
                  autoSkip: false,
                },
                grid: { color: "rgba(255,255,255,0.05)" },
              },
              y: {
                ticks: {
                  color: "#8a93a6",
                  callback: (v) => v + "°",
                  stepSize: 2,
                },
                grid: { color: "rgba(255,255,255,0.05)" },
              },
            },
            plugins: {
              legend: {
                labels: { color: "#f6f7fb" },
              },
            },
          },
        });
      }
      // App state. Page always opens in "outside" mode per spec — no
      // persistence. Forecast is cached so the toggle re-renders instantly
      // without re-hitting the API.
      const state = {
        mode: "outside",
        forecast: null,
      };
      function renderVerdict() {
        const verdictEl = document.getElementById("verdict");
        if (!state.forecast) return;
        const times = state.forecast.hourly.time;
        const apparents = state.forecast.hourly.apparent_temperature;
        const verdict =
          state.mode === "home"
            ? decideHome(apparents, times)
            : decideOutside(apparents, times);
        verdictEl.classList.remove("loading", "puff", "normal", "none");
        verdictEl.classList.add(verdict.key);
        verdictEl.textContent = verdict.label;
      }
      function wireToggle() {
        const buttons = document.querySelectorAll(".mode-option");
        buttons.forEach((btn) => {
          btn.addEventListener("click", () => {
            const mode = btn.getAttribute("data-mode");
            if (mode === state.mode) return;
            state.mode = mode;
            buttons.forEach((b) => {
              const isActive = b.getAttribute("data-mode") === mode;
              b.classList.toggle("is-active", isActive);
              b.setAttribute("aria-selected", isActive ? "true" : "false");
            });
            renderVerdict();
          });
        });
      }
      async function run() {
        const locEl = document.getElementById("loc");
        const noteEl = document.getElementById("note");
        const subEl = document.getElementById("sub");
        const verdictEl = document.getElementById("verdict");
        wireToggle();
        const { lat, lon, fallback } = await getLocation();
        if (fallback) {
          locEl.textContent = "Melbourne (default)";
          noteEl.textContent = "Couldn't get your location. Showing Melbourne.";
        } else {
          const name = await reverseGeocode(lat, lon);
          locEl.textContent =
            name || lat.toFixed(2) + ", " + lon.toFixed(2);
        }
        let forecast;
        try {
          forecast = await getForecast(lat, lon);
        } catch (e) {
          verdictEl.classList.remove("loading", "puff", "normal", "none");
          verdictEl.textContent = "Sky unreachable";
          subEl.textContent =
            "The weather API didn't answer. Try refreshing.";
          return;
        }
        state.forecast = forecast;
        const times = forecast.hourly.time;
        const actuals = forecast.hourly.temperature_2m;
        const apparents = forecast.hourly.apparent_temperature;
        renderVerdict();
        const minA = Math.round(Math.min(...actuals));
        const maxA = Math.round(Math.max(...actuals));
        const minF = Math.round(Math.min(...apparents));
        const maxF = Math.round(Math.max(...apparents));
        subEl.textContent =
          "Today: " +
          minA +
          "°–" +
          maxA +
          "° · Feels like " +
          minF +
          "°–" +
          maxF +
          "°";
        drawChart(times, actuals, apparents);
      }
      run();
    </script>
  </body>
</html>
