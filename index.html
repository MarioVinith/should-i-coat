<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Should I Coat?</title>
    <style>
      :root {
        --bg: #0b0d12;
        --fg: #f6f7fb;
        --muted: #8a93a6;
        --card: #141823;
        --puff: #3b5fe6;
        --normal: #1fb88e;
        --none: #f5a623;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 20px 24px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
      }
      header .brand {
        font-weight: 600;
      }
      header #loc {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">Should I Coat?</div>
      <div id="loc">—</div>
    </header>
    <script></script>
  </body>
</html>
